
name: TWRP 16.0 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 libncurses-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python-is-python3 \
            bc ccache rsync libssl-dev \
            liblz4-tool lz4 zstd \
            libelf-dev libxml2

      - name: Initialize TWRP 16.0
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init --depth=1 \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-16.0

      - name: Sync Sources
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          repo sync -c --no-tags --no-clone-bundle \
            -j$(nproc)

      - name: Clone Roadstr Device Tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          git clone --depth=1 \
            -b main \
            https://github.com/Retardpro/android_device_motorola_roadstr.git \
            device/motorola/roadstr

      - name: Build TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"

          ccache -M 10G

          source build/envsetup.sh

          lunch twrp_roadstr-bp2a-eng

          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-16.0-roadstr
          path: |
            twrp/out/target/product/roadstr/recovery.img
            twrp/out/target/product/roadstr/recovery*.img
          if-no-files-found: error
          
