name: Build TWRP (Motorola roadstr)

on:
  workflow_dispatch:
    inputs:
      device_tree_branch:
        description: "Device tree branch (leave empty for default branch)"
        required: false
        default: ""
      lunch_combo:
        description: "Lunch combo (leave empty to auto-detect, e.g. twrp_roadstr-ap2a-eng)"
        required: false
        default: ""
      build_targets:
        description: "mka targets"
        required: true
        default: "adbd recoveryimage"
      create_release:
        description: "Publish a GitHub release with the images"
        type: boolean
        required: false
        default: false

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-14.1
  DEVICE_TREE_URL: https://github.com/Retardpro/android_device_motorola_roadstr
  DEVICE_PATH: device/motorola/roadstr
  DEVICE_CODENAME: roadstr
  TZ: Asia/Kolkata
  # ccache is intentionally disabled: the Soong sandbox makes everything outside out/ read-only
  USE_CCACHE: "0"
  TWRP_DIR: ${{ github.workspace }}/twrp

jobs:
  build:
    name: Build recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      # Pools the free space of / and /mnt into one big volume mounted at the workspace.
      # Must run before anything is written to the workspace.
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Show disk
        run: df -h / "$GITHUB_WORKSPACE"; free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip unzip curl wget zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig \
            libncurses5 libncurses5-dev libssl-dev bc lzop python3 python3-pip \
            rsync ccache lz4 xz-utils pngcrush schedtool imagemagick openjdk-17-jdk \
            cpio file git-lfs ca-certificates
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python || true

      - name: Configure git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

      - name: Init TWRP source
        run: |
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      - name: Sync source
        working-directory: ${{ env.TWRP_DIR }}
        run: |
          repo sync -c --no-tags --no-clone-bundle -j"$(nproc)" \
            || repo sync -c --no-tags --no-clone-bundle -j4 --force-sync
          df -h /

      - name: Clone device tree
        working-directory: ${{ env.TWRP_DIR }}
        run: |
          BRANCH_ARG=""
          if [ -n "${{ github.event.inputs.device_tree_branch }}" ]; then
            BRANCH_ARG="-b ${{ github.event.inputs.device_tree_branch }}"
          fi
          git clone --depth=1 $BRANCH_ARG "$DEVICE_TREE_URL" "$DEVICE_PATH"
          ls -la "$DEVICE_PATH"

      - name: Build recovery
        working-directory: ${{ env.TWRP_DIR }}
        run: |
          set +e
          set -o pipefail
          source build/envsetup.sh
          # This tree needs <product>-<release>-<variant>; the release (ap1a/ap2a/...) is auto-detected below
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          echo "Available release configs:"
          ls build/release/release_configs 2>/dev/null || true
          REQUESTED="${{ github.event.inputs.lunch_combo }}"
          if [ -n "$REQUESTED" ]; then
            CANDIDATES="$REQUESTED"
          else
            CANDIDATES="twrp_roadstr-ap2a-eng twrp_roadstr-ap1a-eng twrp_roadstr-ap3a-eng twrp_roadstr-trunk_staging-eng twrp_roadstr-eng"
          fi
          LUNCH_USED=""
          for c in $CANDIDATES; do
            echo ">>> trying lunch $c"
            if lunch "$c"; then LUNCH_USED="$c"; break; fi
          done
          if [ -z "$LUNCH_USED" ]; then
            echo "::error::No valid lunch combo found (tried: $CANDIDATES)"
            exit 1
          fi
          echo "Using lunch combo: $LUNCH_USED"
          echo "LUNCH_USED=$LUNCH_USED" >> "$GITHUB_ENV"
          mka ${{ github.event.inputs.build_targets || 'adbd recoveryimage' }} -j"$(nproc --all)" 2>&1 | tee "$HOME/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Collect output
        if: success()
        working-directory: ${{ env.TWRP_DIR }}
        run: |
          OUT="out/target/product/${DEVICE_CODENAME}"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for f in recovery.img boot.img vendor_boot.img; do
            [ -f "$OUT/$f" ] && cp -v "$OUT/$f" "$GITHUB_WORKSPACE/artifacts/"
          done
          ls -lh "$GITHUB_WORKSPACE/artifacts"
          (cd "$GITHUB_WORKSPACE/artifacts" && sha256sum * > SHA256SUMS.txt)
          if ! ls "$GITHUB_WORKSPACE/artifacts"/*.img >/dev/null 2>&1; then
            echo "::error::No images were produced in $OUT"
            ls -la "$OUT" || true
            exit 1
          fi

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE_CODENAME }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /home/runner/build.log
          if-no-files-found: ignore

      - name: Create release
        if: success() && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-${{ env.DEVICE_CODENAME }}-${{ github.run_number }}
          name: TWRP ${{ env.DEVICE_CODENAME }} #${{ github.run_number }}
          body: |
            TWRP build for Motorola ${{ env.DEVICE_CODENAME }}
            - Manifest branch: `${{ env.MANIFEST_BRANCH }}`
            - Lunch: `${{ env.LUNCH_USED }}`
            - Device tree: ${{ env.DEVICE_TREE_URL }}
          files: artifacts/*
          
